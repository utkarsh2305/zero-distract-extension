<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero Distract</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="logo-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M7 7H17L7 17H17" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="4" y1="20" x2="20" y2="4" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="title">Zero Distract</span>
      </div>
      <div class="header-right">
        <span class="date-label">Today</span>
        <button class="settings-button" id="settingsButton" title="Settings">⚙</button>
      </div>
    </div>

    <!-- Focus Mode Toggle -->
    <button class="focus-toggle" id="focusToggle">
      <div class="focus-toggle-content">
        <span class="focus-icon" id="focusIcon">⏸</span>
        <div class="focus-text">
          <div class="focus-title" id="focusTitle">Focus Mode Off</div>
          <div class="focus-subtitle" id="focusSubtitle">Tap to start focusing</div>
        </div>
      </div>
      <div class="toggle-switch" id="toggleSwitch">
        <div class="toggle-circle"></div>
      </div>
    </button>

    <!-- Top Distractions -->
    <div class="section">
      <div class="section-label">Top distractions today</div>
      <div class="distraction-list">
        <div class="distraction-item">
          <div class="distraction-header">
            <span class="distraction-name">twitter.com</span>
            <span class="distraction-time">47m</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill progress-danger" style="width: 62%"></div>
          </div>
        </div>
        <div class="distraction-item">
          <div class="distraction-header">
            <span class="distraction-name">reddit.com</span>
            <span class="distraction-time">31m</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill progress-warning" style="width: 41%"></div>
          </div>
        </div>
        <div class="distraction-item">
          <div class="distraction-header">
            <span class="distraction-name">youtube.com</span>
            <span class="distraction-time">18m</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill progress-accent" style="width: 24%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Focus Score -->
    <div class="score-card">
      <div class="score-left">
        <div class="score-label">Focus score</div>
        <div class="score-value">72<span class="score-total">/100</span></div>
      </div>
      <div class="score-right">
        <div class="score-label">vs yesterday</div>
        <div class="score-change">↑ 8%</div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button class="dashboard-button">Open Full Dashboard →</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
